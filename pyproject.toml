[tool.poetry]
name = "clipbarcode"
version = "2.1.5"
description = "Aplicação para leitura de códigos de barras e QR Codes a partir de capturas de tela."
authors = ["Vinícius Costa <viniciusccosta95@gmail.com>"]
license = "MIT"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "~3.12"
markdown = "^3.7"
peewee = "^3.17.9"
pillow = "^12.3.0"
pyparsing = "^3.2.3"
pyperclip = "^1.9.0"
pytesseract = "^0.3.13"
python-dateutil = "^2.9.0.post0"
python-decouple = "^3.8"
python-dotenv = "^1.1.0"
pyzbar = "^0.1.9"
requests = "^2.32.3"
rich = "^14.0.0"
tkhtmlview = "^0.3.1"
toml = "^0.10.2"
ttkbootstrap = "^1.12.0"

[tool.poetry.group.dev.dependencies]
pdoc3 = "^0.11.6"
pre-commit = "^4.6.0"
pyinstaller = "^6.12.0"
pytest = "^8.3.5"
taskipy = "^1.14.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.taskipy.tasks]
test = "pytest -x --tb=short --disable-warnings -p no:warnings"
build = "./scripts/build.sh && ./scripts/create_dmg.sh"
docs = "pdoc --html --output-dir docs --force clipbarcode"
